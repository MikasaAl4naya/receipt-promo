<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Чек на удачу</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="body--auth">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo__box"></div>
    </div>
    <h1 class="auth-card__title">Войти в личный кабинет</h1>

    {% if form.errors %}
      <div class="alert alert--error">Неверный логин или пароль</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label class="field__label" for="id_username">Имя пользователя</label>
        <input class="field__input" type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="field">
        <label class="field__label" for="id_password">Пароль</label>
        <input class="field__input" type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn--primary btn--lg" style="margin-top:8px">Войти</button>
    </form>
  </div>
</body>
</html>
