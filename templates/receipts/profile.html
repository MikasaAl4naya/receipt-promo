{% extends "base.html" %}

{% block title %}Профиль — Чек на удачу{% endblock %}

{% block content %}
<div class="card" style="max-width:520px;margin:0 auto">
  <h1 class="page-head__title" style="margin-bottom:24px">Профиль</h1>

  <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--c-border);flex-shrink:0"></div>
    <div>
      <div style="font-size:18px;font-weight:700;color:var(--c-text)">{{ user.username }}</div>
      <div style="font-size:14px;color:var(--c-muted);margin-top:2px">{{ user.email|default:"Email не указан" }}</div>
    </div>
  </div>

  <div style="border:1px solid var(--c-border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:24px">
    <div style="display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--c-border)">
      <span style="color:var(--c-muted);font-size:14px">Логин</span>
      <span style="font-weight:600;font-size:14px">{{ user.username }}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--c-border)">
      <span style="color:var(--c-muted);font-size:14px">Email</span>
      <span style="font-weight:600;font-size:14px">{{ user.email|default:"—" }}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:14px 18px">
      <span style="color:var(--c-muted);font-size:14px">Зарегистрировано чеков</span>
      <span style="font-weight:700;font-size:14px;color:var(--c-primary)">{{ total }}</span>
    </div>
  </div>

  <a href="{% url 'cabinet' %}" class="btn btn--primary" style="width:100%;justify-content:center">
    История чеков
  </a>
</div>
{% endblock %}
